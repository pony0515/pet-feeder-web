<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 智慧餵食器</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --primary-color: #ff9800;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }

        /* 修改後的影像區域：由 placeholder 改為實體容器 */
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            overflow: hidden; /* 確保 iframe 的直角不會超出外框的圓角 */
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            background: rgba(0,0,0,0.3);
        }

        .online { color: #4caf50; }
        .offline { color: #f44336; }

        .feed-btn {
            background: var(--primary-color);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .feed-btn:active {
            transform: scale(0.95);
        }

        .log-area {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            height: 80px;
            overflow-y: auto;
        }

        .log-entry { margin-bottom: 5px; border-left: 3px solid var(--primary-color); padding-left: 8px; }

    </style>
</head>
<body>

<div class="container">
    <div id="conn-status" class="status-badge">● MQTT 連線中...</div>
    <h1>🐱 智慧餵食器控制</h1>

    <div class="video-container">
        <iframe 
            src="https://saturnina-unsatiric-humanly.ngrok-free.dev/stream.html?src=pet2" 
            allow="autoplay; fullscreen"
            scrolling="no">
        </iframe>
    </div>

    <button class="feed-btn" onclick="sendFeedCommand()">立即餵食</button>

    <div class="log-area" id="logArea">
        <div class="log-entry">系統就緒...</div>
    </div>
</div>

<script>
    // MQTT 設定
    const client = mqtt.connect('wss://mqtt-dashboard.com:8884/mqtt');
    const statusBadge = document.getElementById('conn-status');
    const logArea = document.getElementById('logArea');

    client.on('connect', () => {
        statusBadge.innerHTML = "● 雲端已連線";
        statusBadge.className = "status-badge online";
        addLog("MQTT 伺服器已成功連線");
    });

    client.on('offline', () => {
        statusBadge.innerHTML = "● 斷線中";
        statusBadge.className = "status-badge offline";
    });

    function addLog(msg) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.prepend(entry);
    }

    function sendFeedCommand() {
        const topic = "my_pet_feeder/cmd";
        const payload = JSON.stringify({ action: "feed", device: "Web", timestamp: Date.now() });
        
        if (client.connected) {
            client.publish(topic, payload, { qos: 1 });
            addLog("發送餵食指令成功！");
        } else {
            addLog("錯誤：連線已中斷，無法餵食");
        }
    }
</script>

</body>
</html>
